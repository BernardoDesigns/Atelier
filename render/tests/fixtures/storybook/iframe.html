<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story frame</title>
<style>
  body { margin: 0; padding: 16px; background: #ffffff; color: #1a1a1a; font-family: system-ui, sans-serif; }
  html.dark body { background: #111111; color: #f2f2f2; }
</style>
</head>
<body class="sb-show-preparing-story">
  <div id="storybook-root"></div>
  <script>
    // Like Storybook: the story is rendered by script some time after the load event.
    // id contains "never": never renders. id contains "noalt": renders an image without alt text,
    // which axe flags, so an axe result proves the harness waited for the story.
    var id = new URLSearchParams(location.search).get('id') || '';
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (id.indexOf('never') !== -1) return;
        document.body.classList.remove('sb-show-preparing-story');
        document.getElementById('storybook-root').innerHTML =
          id.indexOf('noalt') !== -1 ? '<img src="/pic.png" width="40" height="40">' : '<p>Story content</p>';
      }, 400);
    });
  </script>
</body>
</html>
