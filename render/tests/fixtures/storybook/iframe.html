<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story frame</title>
<style>
  body { margin: 0; padding: 16px; background: #ffffff; color: #1a1a1a; font-family: system-ui, sans-serif; }
  html.dark body { background: #111111; color: #f2f2f2; }
  .box { width: 100px; height: 100px; background: #c00; }
  /* End state differs from the base style (red), so "end state" and "animation removed" look different. */
  @keyframes toblue { from { background: #fc0; } to { background: #00c; } }
  .endblue { animation: toblue 100s linear forwards; }
  .solidblue { background: #00c; }
  /* Infinite: held at its first frame (green). */
  @keyframes loop { 0% { background: #0a0; } 50% { background: #00c; } 100% { background: #0a0; } }
  .loopgreen { animation: loop 2s linear infinite; }
  .solidgreen { background: #0a0; }
</style>
</head>
<body class="sb-show-preparing-story">
  <div id="storybook-root"></div>
  <script>
    // A small stand-in for a Storybook 10 preview frame. Ids select behaviours (substring match):
    //   never    : never renders.            noalt  : renders an image without alt (axe flags it).
    //   portal   : content only in a node appended to body (#storybook-root stays empty).
    //   override : story-level globals force light, ignoring the ?globals=theme:dark URL global.
    // Lifecycle modelled on Storybook 10: ... -> completing -> completed -> afterEach -> finished (same tick here).
    //   playerr  : play throws: phase "errored", body gets sb-show-errordisplay, then "finished"; the channel
    //              gets playFunctionThrewException and storyFinished {status:"error"}.
    //   quiet    : throwPlayFunctionExceptions:false. Phase goes errored, is overwritten by "completing", ends
    //              "finished" with NO error display; only playFunctionThrewException is emitted
    //              (storyFinished says "success").
    //   finerr   : ends "finished" with no error display, storyFinished {status:"error"} (unhandled errors).
    //   abort    : ends on phase "aborted".   hang : play never finishes (phase "playing").
    //   slowplay : phase is "playing" for 800ms; the flagged image only appears once it is "finished".
    //   hovercover : an invisible overlay sits on top of the buttons (hover cannot reach them).
    //   hovernone / hoverempty : parameters.harness.hover = false / "".
    //   endblue / solidblue / loopgreen / solidgreen : animation fixtures (see the styles above).
    //   hover    : two buttons; real pointer hover on #b1 inserts an image without alt, on #b2 an unlabeled input.
    //   hoverparam : like hover, and parameters.harness.hover = "#b2".
    //   fixed / tall : layout fixtures.
    // Any mousedown or click inserts an empty button, so a harness that clicks gets a button-name failure.
    var id = new URLSearchParams(location.search).get('id') || '';
    var globalsParam = new URLSearchParams(location.search).get('globals') || '';
    var wantDark = globalsParam.split(';').indexOf('theme:dark') !== -1 && id.indexOf('override') === -1;

    // Like withThemeByClassName with light = "": the decorator owns the class and strips anything else.
    function applyTheme() { document.documentElement.classList.toggle('dark', wantDark); }
    new MutationObserver(function () {
      if (document.documentElement.classList.contains('dark') !== wantDark) applyTheme();
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    applyTheme();

    var render = { phase: 'preparing', story: { parameters: {} } };
    if (id.indexOf('hoverparam') !== -1) render.story.parameters.harness = { hover: '#b2' };
    if (id.indexOf('hovernone') !== -1) render.story.parameters.harness = { hover: false };
    if (id.indexOf('hoverempty') !== -1) render.story.parameters.harness = { hover: '' };
    window.__STORYBOOK_PREVIEW__ = { currentRender: render };

    // A minimal addons channel, assigned with a plain assignment like Storybook does.
    var listeners = {};
    window.__STORYBOOK_ADDONS_CHANNEL__ = {
      on: function (name, fn) { (listeners[name] = listeners[name] || []).push(fn); },
      emit: function (name, payload) { (listeners[name] || []).forEach(function (fn) { fn(payload); }); }
    };
    var ch = window.__STORYBOOK_ADDONS_CHANNEL__;
    function finish(status) {
      render.phase = 'completing'; render.phase = 'completed'; render.phase = 'afterEach';
      render.phase = 'finished';
      ch.emit('storyFinished', { storyId: id, status: status || 'success', reporters: [] });
    }

    function trap() {
      var b = document.createElement('button');
      b.id = 'trap';
      document.body.appendChild(b);
    }
    document.addEventListener('mousedown', trap);
    document.addEventListener('click', trap);

    function html() {
      if (id.indexOf('noalt') !== -1) return '<img src="/pic.png" width="40" height="40">';
      if (id.indexOf('hover') !== -1) return '<button id="b1">One</button> <button id="b2">Two</button><div id="out"></div>';
      if (id.indexOf('endblue') !== -1) return '<div class="box endblue"></div>';
      if (id.indexOf('solidblue') !== -1) return '<div class="box solidblue"></div>';
      if (id.indexOf('loopgreen') !== -1) return '<div class="box loopgreen"></div>';
      if (id.indexOf('solidgreen') !== -1) return '<div class="box solidgreen"></div>';
      if (id.indexOf('fixed') !== -1) return '<div style="position:fixed;top:0;left:0;width:100%;height:100vh;background:#336699"></div>';
      if (id.indexOf('tall') !== -1) return '<div style="height:2000px;background:#eee"></div><div style="position:fixed;top:0;left:0;width:100%;height:100vh;background:#336699"></div>';
      return '<p>Story content</p>';
    }

    window.addEventListener('load', function () {
      setTimeout(function () {
        if (id.indexOf('never') !== -1) return;
        applyTheme();
        document.body.classList.remove('sb-show-preparing-story');
        if (id.indexOf('portal') !== -1) {
          var portal = document.createElement('div');
          portal.id = 'portal-node';
          portal.innerHTML = '<p>Portal content</p>';
          document.body.appendChild(portal);
          finish();
          return;
        }
        var root = document.getElementById('storybook-root');
        if (id.indexOf('slowplay') !== -1) {
          root.innerHTML = '<p>Story content</p>';
          render.phase = 'playing';
          setTimeout(function () {
            root.innerHTML = '<p>Story content</p><img src="/pic.png" width="40" height="40">';
            finish();
          }, 800);
          return;
        }
        root.innerHTML = html();
        if (id.indexOf('hovercover') !== -1) {
          var cover = document.createElement('div');
          cover.id = 'cover';
          cover.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;';
          document.body.appendChild(cover);
        }
        if (id.indexOf('hover') !== -1) {
          document.getElementById('b1').addEventListener('mouseover', function () {
            document.getElementById('out').innerHTML = '<img src="/pic.png" width="40" height="40">';
          });
          document.getElementById('b2').addEventListener('mouseover', function () {
            document.getElementById('out').innerHTML = '<input type="text">';
          });
        }
        if (id.indexOf('playerr') !== -1) {
          render.phase = 'errored';
          document.body.classList.add('sb-show-errordisplay');
          ch.emit('playFunctionThrewException', { message: 'boom in play' });
          render.phase = 'finished';
          ch.emit('storyFinished', { storyId: id, status: 'error', reporters: [] });
        } else if (id.indexOf('quiet') !== -1) {
          render.phase = 'errored';
          ch.emit('playFunctionThrewException', { message: 'quiet boom in play' });
          finish('success');
        } else if (id.indexOf('finerr') !== -1) finish('error');
        else if (id.indexOf('abort') !== -1) render.phase = 'aborted';
        else if (id.indexOf('hang') !== -1) render.phase = 'playing';
        else finish();
      }, 400);
    });
  </script>
</body>
</html>
