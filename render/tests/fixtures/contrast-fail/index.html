<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrast fixture</title>
<style>
  body { margin: 0; padding: 24px; background: #ffffff; color: #1a1a1a; font-family: system-ui, sans-serif; }
  /* Dark theme only: dark grey text on a near-black background, about 1.3:1. */
  html.dark body { background: #111111; color: #2a2a2a; }
</style>
</head>
<body>
  <main>
    <h1>Contrast fixture</h1>
    <p>This paragraph is readable in light and nearly invisible in dark.</p>
  </main>
</body>
</html>
